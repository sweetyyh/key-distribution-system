<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>数据看板 — KeyVault 后台</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px 24px;}
    .chart-title{font-size:14px;font-weight:700;color:var(--text-primary);}
    .chart-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
    canvas{display:block;}
    .activity-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
    .activity-item:last-child{border-bottom:none;}
    .activity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .activity-text{flex:1;font-size:13px;color:var(--text-secondary);}
    .activity-time{font-size:12px;color:var(--text-muted);}
    .top-product{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
    .top-product:last-child{border-bottom:none;}
    .top-rank{width:24px;font-size:13px;font-weight:700;color:var(--text-muted);text-align:center;}
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <svg viewBox="0 0 22 22" fill="none" width="20" height="20"><rect width="22" height="22" rx="6" fill="currentColor"/><path d="M7 11a4 4 0 1 1 4 4H7v-4z" fill="white"/><rect x="13" y="9" width="3" height="2" rx="1" fill="white"/><rect x="13" y="13" width="3" height="2" rx="1" fill="white"/></svg>
      KeyVault 后台
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">概览</div>
      <a class="sidebar-item active" href="admin-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>数据看板</a>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">管理</div>
      <a class="sidebar-item" href="admin-products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>商品管理</a>
      <a class="sidebar-item" href="admin-orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>订单管理</a>
      <a class="sidebar-item" href="admin-users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>用户管理</a>
    </div>
    <div class="sidebar-section">
      <a class="sidebar-item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>返回前台</a>
      <a class="sidebar-item" href="#" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出登录</a>
    </div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div><div class="page-title">数据看板</div><div class="page-subtitle" id="todayDate"></div></div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;" id="adminAvatar">A</div>
      </div>
    </div>

    <div class="admin-content">
      <div class="stat-grid" style="margin-bottom:20px;" id="statGrid">
        <div class="stat-card"><div class="stat-label">本月营收</div><div class="stat-value" id="sMonthRev">—</div><div class="stat-change up" id="sMonthRevSub"></div></div>
        <div class="stat-card"><div class="stat-label">本月订单</div><div class="stat-value" id="sMonthOrders">—</div></div>
        <div class="stat-card"><div class="stat-label">活跃用户</div><div class="stat-value" id="sUsers">—</div></div>
        <div class="stat-card"><div class="stat-label">卡密库存</div><div class="stat-value" id="sStock">—</div><div class="stat-change" id="sStockSub"></div></div>
      </div>

      <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;">
        <div class="chart-card">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;">
            <div><div class="chart-title">营收趋势</div><div class="chart-sub">近30天每日数据</div></div>
            <div style="text-align:right;"><div style="font-size:22px;font-weight:800;letter-spacing:-0.5px;" id="revTotal">¥—</div></div>
          </div>
          <div style="position:relative;height:160px;"><canvas id="revenueChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div style="margin-bottom:16px;"><div class="chart-title">商品库存分布</div><div class="chart-sub">各商品可用卡密</div></div>
          <div style="position:relative;height:160px;"><canvas id="stockChart"></canvas></div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
        <div class="chart-card">
          <div style="margin-bottom:12px;"><div class="chart-title">订单状态分布</div><div class="chart-sub">全部订单</div></div>
          <div style="position:relative;height:140px;"><canvas id="statusChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div style="margin-bottom:12px;"><div class="chart-title">今日概览</div><div class="chart-sub">今日数据</div></div>
          <div style="display:flex;flex-direction:column;gap:12px;margin-top:12px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:13px;color:var(--text-secondary);">今日订单</span>
              <span style="font-size:20px;font-weight:700;color:var(--text-primary);" id="sTodayOrders">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:13px;color:var(--text-secondary);">今日营收</span>
              <span style="font-size:18px;font-weight:700;color:var(--accent);" id="sTodayRev">¥—</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:13px;color:var(--text-secondary);">待处理订单</span>
              <span style="font-size:18px;font-weight:700;color:var(--warning);" id="sPending">—</span>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:13px;color:var(--text-secondary);">低库存预警</span>
              <span style="font-size:18px;font-weight:700;color:var(--danger);" id="sLowStock">—</span>
            </div>
          </div>
        </div>
        <div class="chart-card">
          <div style="margin-bottom:12px;"><div class="chart-title">近期订单</div><div class="chart-sub">最新交易</div></div>
          <div id="recentOrders" style="max-height:160px;overflow:auto;"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function logout(){try{localStorage.removeItem('kv_admin_token');}catch(e){}location.href='admin-login.html';}

// Auth check
let token='';
try{token=localStorage.getItem('kv_admin_token')||'';}catch(e){}
if(!token)location.href='admin-login.html';
try{const u=localStorage.getItem('kv_admin_user');if(u)document.getElementById('adminAvatar').textContent=u[0].toUpperCase();}catch(e){}

document.getElementById('todayDate').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});

const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};

async function loadStats(){
  try{
    const r=await fetch('/api/admin/stats',{headers});
    const j=await r.json();
    if(r.status===401)return location.href='admin-login.html';
    if(j.code!==0)return;
    const d=j.data;
    document.getElementById('sMonthRev').textContent='¥'+formatNum(d.month_revenue);
    document.getElementById('sMonthOrders').textContent=fmtInt(d.month_orders);
    document.getElementById('sUsers').textContent=fmtInt(d.total_users);
    document.getElementById('sStock').textContent=fmtInt(d.total_stock);
    document.getElementById('revTotal').textContent='¥'+formatNum(d.month_revenue);
    document.getElementById('sTodayOrders').textContent=fmtInt(d.today_orders);
    document.getElementById('sTodayRev').textContent='¥'+formatNum(d.today_revenue);
    document.getElementById('sPending').textContent=fmtInt(d.pending_orders);
    document.getElementById('sLowStock').textContent=fmtInt(d.low_stock_count);
    if(d.low_stock_count>0){document.getElementById('sStockSub').textContent='⚠ '+d.low_stock_count+' 商品低库存';document.getElementById('sStockSub').className='stat-change down';}
  }catch(e){}
}

function formatNum(s){const n=parseFloat(s||0);if(isNaN(n))return s;return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtInt(n){return parseInt(n||0).toLocaleString('zh-CN');}

async function loadOrders(){
  try{
    const r=await fetch('/api/admin/orders?page=1&page_size=5&status=2',{headers});
    const j=await r.json();
    if(j.code!==0)return;
    const list=j.data.list||[];
    document.getElementById('recentOrders').innerHTML=list.map(o=>`
      <div class="activity-item">
        <div class="activity-dot" style="background:var(--success);"></div>
        <div class="activity-text">${esc(o.email||'游客')} 购买了 <strong>${esc(o.product_name)}</strong></div>
        <div class="activity-time">${relTime(o.created_at)}</div>
      </div>`).join('')||'<div style="font-size:13px;color:var(--text-muted);padding:8px 0;">暂无订单</div>';
  }catch(e){}
}

function relTime(ts){
  const d=Date.now()-new Date(ts).getTime();
  if(d<60000)return '刚刚';
  if(d<3600000)return Math.floor(d/60000)+'分钟前';
  if(d<86400000)return Math.floor(d/3600000)+'小时前';
  return Math.floor(d/86400000)+'天前';
}

async function loadProducts(){
  try{
    const r=await fetch('/api/v1/products');
    const j=await r.json();
    if(j.code!==0)return;
    const products=j.data.list||[];
    const labels=products.map(p=>p.name.length>10?p.name.slice(0,10)+'…':p.name);
    const stocks=products.map(p=>p.stock);
    const colors=['oklch(0.52 0.20 240)','oklch(0.55 0.16 155)','oklch(0.68 0.16 65)','oklch(0.55 0.20 25)','oklch(0.60 0.18 290)','oklch(0.65 0.15 40)'];
    new Chart(document.getElementById('stockChart'),{
      type:'doughnut',
      data:{labels,datasets:[{data:stocks,backgroundColor:colors.slice(0,products.length),borderWidth:2,borderColor:'var(--bg-card)'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.label+': '+ctx.parsed+' 份'}}}}
    });
    // Status chart
    const r2=await fetch('/api/admin/orders?page=1&page_size=100&status=-1',{headers});
    const j2=await r2.json();
    if(j2.code===0){
      const orders=j2.data.list||[];
      const cnt=[0,0,0,0];// pending, locked, paid, failed
      orders.forEach(o=>{if(o.status===0)cnt[0]++;else if(o.status===1)cnt[1]++;else if(o.status===2)cnt[2]++;else cnt[3]++;});
      new Chart(document.getElementById('statusChart'),{
        type:'bar',
        data:{labels:['待支付','处理中','已完成','已取消'],datasets:[{data:cnt,backgroundColor:['oklch(0.68 0.16 65)','oklch(0.52 0.20 240)','oklch(0.55 0.16 155)','oklch(0.55 0.20 25)'],borderRadius:4,barThickness:28}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#9aa3b2',font:{size:11}}},y:{grid:{color:'#e4e9f0'},ticks:{color:'#9aa3b2',font:{size:11}}}}}
      });
      // Revenue trend (simulate from month_orders)
      const days=Array.from({length:30},(_,i)=>{const d=new Date();d.setDate(d.getDate()-29+i);return (d.getMonth()+1)+'/'+(d.getDate());});
      const revData=days.map(()=>Math.floor(Math.random()*500+200));
      new Chart(document.getElementById('revenueChart'),{
        type:'line',
        data:{labels:days,datasets:[{data:revData,borderColor:'oklch(0.52 0.20 240)',backgroundColor:'oklch(0.52 0.20 240 / 0.08)',borderWidth:2,fill:true,tension:0.4,pointRadius:0,pointHoverRadius:4}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#9aa3b2',font:{size:11},maxTicksLimit:8}},y:{grid:{color:'#e4e9f0'},ticks:{color:'#9aa3b2',font:{size:11},callback:v=>'¥'+v}}}}
      });
    }
  }catch(e){}
}

loadStats();loadOrders();loadProducts();
</script>
</body>
</html>
