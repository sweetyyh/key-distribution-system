<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Register | Glacier Wholesale</title>

<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(15, 21, 36, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(125, 211, 252, 0.1);
        }
        .glass-input {
            background: rgba(10, 14, 26, 0.4);
            border: 1px solid rgba(125, 211, 252, 0.15);
        }
        .glass-input:focus {
            outline: none;
            border-color: rgba(125, 211, 252, 0.4);
            box-shadow: 0 0 15px rgba(125, 211, 252, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden">
<!-- Background Decor -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10">
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[40%] h-[40%] bg-tertiary/5 rounded-full blur-[120px]"></div>
</div>
<!-- TopNavBar (Shared Component) -->
<nav class="fixed top-0 z-50 flex justify-between items-center px-6 py-4 w-full bg-[#0a0e1a]/60 backdrop-blur-lg border-b border-sky-400/10 shadow-[0_0_30px_rgba(125,211,252,0.05)] font-inter tracking-tight">
<div class="text-2xl font-semibold text-sky-300 tracking-wider">Glacier Wholesale</div>
<div class="flex items-center gap-6">
<a class="text-slate-400 hover:bg-sky-400/10 transition-colors px-3 py-1.5 rounded-md active:scale-95 duration-200" href="#">Catalog</a>
<a class="text-slate-400 hover:bg-sky-400/10 transition-colors px-3 py-1.5 rounded-md active:scale-95 duration-200" href="#">Solutions</a>
<a class="text-sky-300 font-medium px-4 py-2 border border-sky-400/20 rounded-lg hover:bg-sky-400/10 transition-all" href="#">Support</a>
</div>
</nav>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center px-4 py-24 relative">
<!-- Decoration Image -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] opacity-20 pointer-events-none">
<img class="w-full h-full object-contain filter blur-2xl" data-alt="abstract flowing glass waves with icy blue and purple refraction highlights against a dark cinematic background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAVYoZf7oGz92C7H97b-Do4SCd9XNOzVBrS53haQ9QdS826XgLCsfvDDsXHoq1BDLRba9ssgn1XnZEXz6HMMh1k4Y4YFoy1S8AT8IOmOjFYCuvZciwOFJB28-_7_QBausqLy_zSHVT9NebrwyBDD37gD3Twx3m-jbHdL5Y8UNi_4D2OFsCTBTzyOEgDiGLrqE24hssW7eCWhch_57A-gTpdzIYAlCGF2SXTKPZiFX5ZyB5SoaTBwrzugZbmPbQ0ilbVkc0VyEwGDjU"/>
</div>
<!-- Registration Card -->
<div class="glass-panel w-full max-w-[480px] rounded-xl p-8 md:p-10 z-10 shadow-2xl">
<div class="text-center mb-10">
<h1 class="text-3xl font-semibold text-on-surface tracking-tight mb-2">Create Account</h1>
<p class="text-on-surface-variant">Join the Glacier Wholesale platform today.</p>
</div>
<form class="space-y-6">
<!-- Username -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant px-1" for="username">Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors text-[20px]">person</span>
<input class="glass-input w-full pl-10 pr-4 py-3 rounded-lg text-on-surface placeholder:text-outline transition-all" id="username" placeholder="glacier_admin" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant px-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors text-[20px]">mail</span>
<input class="glass-input w-full pl-10 pr-4 py-3 rounded-lg text-on-surface placeholder:text-outline transition-all" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors text-[20px]">lock</span>
<input class="glass-input w-full pl-10 pr-4 py-3 rounded-lg text-on-surface placeholder:text-outline transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant px-1" for="confirm-password">Confirm</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors text-[20px]">lock_reset</span>
<input class="glass-input w-full pl-10 pr-4 py-3 rounded-lg text-on-surface placeholder:text-outline transition-all" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-center gap-3 py-2">
<div class="relative flex items-center">
<input class="w-5 h-5 rounded border-sky-400/20 bg-background/50 text-primary focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant leading-tight cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:underline transition-all" href="#">Terms &amp; Conditions</a> and <a class="text-primary hover:underline transition-all" href="#">Privacy Policy</a>.
                    </label>
</div>
<!-- Action Button -->
<button class="w-full py-4 bg-primary/10 border border-primary/30 text-primary font-semibold rounded-lg hover:bg-primary/20 transition-all active:scale-[0.98] shadow-[0_0_20px_rgba(125,211,252,0.1)]" type="submit">
                    Create Account
                </button>
</form>
<div class="mt-8 pt-6 border-t border-sky-400/10 text-center">
<p class="text-on-surface-variant text-sm">
                    Already have an account? 
                    <a class="text-primary font-medium hover:text-sky-200 transition-colors ml-1" href="#">Log in here</a>
</p>
</div>
</div>
</main>
<!-- Footer (Shared Component) -->
<footer class="w-full py-8 border-t border-sky-400/10 bg-[#0a0e1a] font-inter text-sm mt-auto">
<div class="max-w-7xl mx-auto px-8 flex flex-col md:flex-row justify-between items-center gap-4">
<div class="text-sky-300 font-bold">Glacier Wholesale</div>
<div class="flex gap-8">
<a class="text-slate-500 hover:text-sky-200 transition-colors" href="#">Terms of Service</a>
<a class="text-slate-500 hover:text-sky-200 transition-colors" href="#">Privacy Policy</a>
<a class="text-slate-500 hover:text-sky-200 transition-colors" href="#">Wholesale FAQ</a>
</div>
<div class="text-slate-500">© 2024 Glacier Card Platform. All rights reserved.</div>
</div>
</footer>
</body></html>
