<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>用户管理 — KeyVault 后台</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;background:var(--bg);max-width:280px;}
    .search-box input{border:none;outline:none;font-size:13px;font-family:inherit;color:var(--text-primary);background:transparent;flex:1;min-width:0;width:200px;}
    .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0;}
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><svg viewBox="0 0 22 22" fill="none" width="20" height="20"><rect width="22" height="22" rx="6" fill="currentColor"/><path d="M7 11a4 4 0 1 1 4 4H7v-4z" fill="white"/><rect x="13" y="9" width="3" height="2" rx="1" fill="white"/><rect x="13" y="13" width="3" height="2" rx="1" fill="white"/></svg>KeyVault 后台</div>
    <div class="sidebar-section"><div class="sidebar-section-label">概览</div><a class="sidebar-item" href="admin-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>数据看板</a></div>
    <div class="sidebar-section"><div class="sidebar-section-label">管理</div>
      <a class="sidebar-item" href="admin-products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>商品管理</a>
      <a class="sidebar-item" href="admin-orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>订单管理</a>
      <a class="sidebar-item active" href="admin-users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>用户管理</a>
    </div>
    <div class="sidebar-section"><a class="sidebar-item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>返回前台</a><a class="sidebar-item" href="#" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出</a></div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div><div class="page-title">用户管理</div><div class="page-subtitle">查看注册用户与账号状态</div></div>
      <div style="width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;" id="adminAvatar">A</div>
    </div>
    <div class="admin-content">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;">
        <div class="stat-card"><div class="stat-label">总用户数</div><div class="stat-value" id="sTotal">—</div></div>
        <div class="stat-card"><div class="stat-label">管理员</div><div class="stat-value" id="sAdmins">—</div></div>
        <div class="stat-card"><div class="stat-label">普通用户</div><div class="stat-value" id="sBuyers">—</div></div>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="搜索用户名 / 邮箱…" />
          </div>
          <span style="font-size:12px;color:var(--text-muted);" id="totalCount"></span>
        </div>
        <table class="table">
          <thead><tr><th>用户</th><th>邮箱</th><th>角色</th><th>状态</th><th>注册时间</th></tr></thead>
          <tbody id="userTable"></tbody>
        </table>
        <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;gap:4px;">
          <button class="page-btn" id="prevBtn" onclick="loadUsers(curPage-1)">‹</button>
          <span id="pageInfo" style="font-size:13px;color:var(--text-muted);padding:0 8px;display:flex;align-items:center;"></span>
          <button class="page-btn" id="nextBtn" onclick="loadUsers(curPage+1)">›</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function logout(){try{localStorage.removeItem('kv_admin_token');}catch(e){}location.href='admin-login.html';}
let token='';try{token=localStorage.getItem('kv_admin_token')||'';}catch(e){}
if(!token)location.href='admin-login.html';
try{const u=localStorage.getItem('kv_admin_user');if(u)document.getElementById('adminAvatar').textContent=u[0].toUpperCase();}catch(e){}
const h={'Authorization':'Bearer '+token};
let curPage=1,totalPages=1;

async function loadUsers(page){
  page=Math.max(1,page);curPage=page;
  try{
    const r=await fetch('/api/admin/users?page='+page+'&page_size=20',{headers:h});
    if(r.status===401)return location.href='admin-login.html';
    const j=await r.json();if(j.code!==0)return;
    const list=j.data.list||[];const total=j.data.total||0;totalPages=Math.max(1,Math.ceil(total/20));
    document.getElementById('sTotal').textContent=total;
    document.getElementById('sAdmins').textContent=list.filter(u=>u.role==='admin').length;
    document.getElementById('sBuyers').textContent=list.filter(u=>u.role==='buyer').length;
    document.getElementById('totalCount').textContent='共 '+total+' 个用户';
    document.getElementById('pageInfo').textContent='第 '+page+'/'+totalPages+' 页';
    document.getElementById('prevBtn').disabled=page<=1;document.getElementById('nextBtn').disabled=page>=totalPages;
    const q=document.getElementById('searchInput').value.toLowerCase();
    const filtered=q?list.filter(u=>(u.username||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q)):list;
    renderTable(filtered);
  }catch(e){}
}

const colors=['#4285F4','#E50914','#00a86b','#FF9900','#6366f1','#0078d4','#003087'];
function renderTable(list){
  document.getElementById('userTable').innerHTML=list.map((u,i)=>{
    const c=colors[i%colors.length];
    const cAt=new Date(u.created_at).toLocaleDateString('zh-CN');
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:10px;">
        <div class="avatar" style="background:${c};">${(u.username||'?')[0].toUpperCase()}</div>
        <span style="font-weight:500;">${esc(u.username)}</span>
      </div></td>
      <td style="color:var(--text-secondary);">${esc(u.email)}</td>
      <td><span class="badge ${u.role==='admin'?'badge-blue':'badge-gray'}">${u.role==='admin'?'管理员':'普通用户'}</span></td>
      <td><span class="badge ${u.status===1?'badge-green':'badge-red'}">${u.status===1?'正常':'禁用'}</span></td>
      <td style="font-size:13px;color:var(--text-muted);">${cAt}</td>
    </tr>`;
  }).join('')||'<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-muted);">暂无用户</td></tr>';
}

document.getElementById('searchInput').addEventListener('input',()=>loadUsers(1));
loadUsers(1);
</script>
</body>
</html>
