<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>订单管理 — KeyVault 后台</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .tab-bar{display:flex;gap:2px;background:var(--bg-subtle);border-radius:var(--radius);padding:3px;}
    .tab-btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-muted);transition:all 0.15s;border:none;background:none;}
    .tab-btn.active{background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-sm);}
    .search-box{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;background:var(--bg);max-width:280px;}
    .search-box input{border:none;outline:none;font-size:13px;font-family:inherit;color:var(--text-primary);background:transparent;flex:1;min-width:0;width:200px;}
    .drawer-overlay{position:fixed;inset:0;background:rgba(15,21,32,0.4);z-index:200;opacity:0;pointer-events:none;transition:opacity 0.2s;}
    .drawer-overlay.open{opacity:1;pointer-events:auto;}
    .drawer{position:fixed;right:0;top:0;bottom:0;width:400px;background:var(--bg-card);border-left:1px solid var(--border);z-index:201;transform:translateX(100%);transition:transform 0.25s;overflow-y:auto;}
    .drawer-overlay.open .drawer{transform:translateX(0);}
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><svg viewBox="0 0 22 22" fill="none" width="20" height="20"><rect width="22" height="22" rx="6" fill="currentColor"/><path d="M7 11a4 4 0 1 1 4 4H7v-4z" fill="white"/><rect x="13" y="9" width="3" height="2" rx="1" fill="white"/><rect x="13" y="13" width="3" height="2" rx="1" fill="white"/></svg>KeyVault 后台</div>
    <div class="sidebar-section"><div class="sidebar-section-label">概览</div><a class="sidebar-item" href="admin-dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>数据看板</a></div>
    <div class="sidebar-section"><div class="sidebar-section-label">管理</div>
      <a class="sidebar-item" href="admin-products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>商品管理</a>
      <a class="sidebar-item active" href="admin-orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>订单管理</a>
      <a class="sidebar-item" href="admin-users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>用户管理</a>
    </div>
    <div class="sidebar-section"><a class="sidebar-item" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>返回前台</a><a class="sidebar-item" href="#" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>退出</a></div>
  </aside>

  <div class="admin-main">
    <div class="admin-topbar">
      <div><div class="page-title">订单管理</div><div class="page-subtitle">查看与处理所有交易订单</div></div>
      <div style="width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;" id="adminAvatar">A</div>
    </div>
    <div class="admin-content">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;">
        <div class="stat-card"><div class="stat-label">今日订单</div><div class="stat-value" style="font-size:26px;" id="sTodayOrders">—</div></div>
        <div class="stat-card"><div class="stat-label">今日营收</div><div class="stat-value" style="font-size:26px;" id="sTodayRev">¥—</div></div>
        <div class="stat-card"><div class="stat-label">待处理</div><div class="stat-value" style="font-size:26px;color:var(--warning);" id="sPending">—</div></div>
        <div class="stat-card"><div class="stat-label">本月订单</div><div class="stat-value" style="font-size:26px;" id="sMonthOrders">—</div></div>
      </div>
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
          <div class="tab-bar">
            <button class="tab-btn active" onclick="selectTab(this,-1)">全部</button>
            <button class="tab-btn" onclick="selectTab(this,2)">已完成</button>
            <button class="tab-btn" onclick="selectTab(this,0)">待支付</button>
          </div>
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" id="searchInput" placeholder="搜索订单号…" />
          </div>
        </div>
        <table class="table">
          <thead><tr><th>订单号</th><th>商品</th><th>邮箱</th><th>金额</th><th>状态</th><th>时间</th><th></th></tr></thead>
          <tbody id="orderTable"></tbody>
        </table>
        <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:13px;color:var(--text-muted);" id="totalCount"></span>
          <div style="display:flex;gap:4px;">
            <button class="page-btn" id="prevBtn" onclick="loadOrders(curPage-1)">‹</button>
            <span id="pageInfo" style="font-size:13px;color:var(--text-muted);display:flex;align-items:center;padding:0 8px;"></span>
            <button class="page-btn" id="nextBtn" onclick="loadOrders(curPage+1)">›</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()">
  <div class="drawer" onclick="event.stopPropagation()">
    <div style="padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg-card);">
      <span style="font-size:16px;font-weight:700;">订单详情</span>
      <span style="cursor:pointer;color:var(--text-muted);font-size:18px;" onclick="closeDrawer()">✕</span>
    </div>
    <div style="padding:24px;" id="drawerBody"></div>
  </div>
</div>

<script>
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function logout(){try{localStorage.removeItem('kv_admin_token');}catch(e){}location.href='admin-login.html';}
let token='';try{token=localStorage.getItem('kv_admin_token')||'';}catch(e){}
if(!token)location.href='admin-login.html';
try{const u=localStorage.getItem('kv_admin_user');if(u)document.getElementById('adminAvatar').textContent=u[0].toUpperCase();}catch(e){}
const h={'Authorization':'Bearer '+token};
let curStatus=-1,curPage=1,totalPages=1;

async function loadStats(){
  try{const r=await fetch('/api/admin/stats',{headers:h});if(r.status===401)return location.href='admin-login.html';const j=await r.json();if(j.code!==0)return;const d=j.data;
  document.getElementById('sTodayOrders').textContent=d.today_orders;
  document.getElementById('sTodayRev').textContent='¥'+parseFloat(d.today_revenue||0).toFixed(2);
  document.getElementById('sPending').textContent=d.pending_orders;
  document.getElementById('sMonthOrders').textContent=d.month_orders;}catch(e){}
}

async function loadOrders(page){
  page=Math.max(1,page);curPage=page;
  const url='/api/admin/orders?page='+page+'&page_size=20&status='+curStatus;
  try{
    const r=await fetch(url,{headers:h});if(r.status===401)return location.href='admin-login.html';
    const j=await r.json();if(j.code!==0)return;
    const list=j.data.list||[];const total=j.data.total||0;totalPages=Math.max(1,Math.ceil(total/20));
    document.getElementById('totalCount').textContent='共 '+total+' 条订单';
    document.getElementById('pageInfo').textContent='第 '+page+'/'+totalPages+' 页';
    document.getElementById('prevBtn').disabled=page<=1;document.getElementById('nextBtn').disabled=page>=totalPages;
    const q=document.getElementById('searchInput').value.toLowerCase();
    const filtered=q?list.filter(o=>(o.order_no||'').toLowerCase().includes(q)||(o.email||'').toLowerCase().includes(q)):list;
    renderTable(filtered);
  }catch(e){}
}

const SM={0:{l:'待支付',c:'badge-orange'},1:{l:'处理中',c:'badge-blue'},2:{l:'已完成',c:'badge-green'},3:{l:'已取消',c:'badge-gray'}};
function renderTable(list){
  document.getElementById('orderTable').innerHTML=list.map(o=>{
    const s=SM[o.status]||{l:'未知',c:'badge-gray'};
    const t=new Date(o.created_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    const enc=encodeURIComponent(JSON.stringify(o));
    return `<tr style="cursor:pointer;" onclick="openDrawer('${enc}')">
      <td><span style="font-family:monospace;font-size:12px;">${esc(o.order_no)}</span></td>
      <td style="max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(o.product_name)}</td>
      <td style="color:var(--text-secondary);font-size:13px;">${esc(o.email||'—')}</td>
      <td style="color:var(--accent);font-weight:600;">¥${esc(o.total_amount)}</td>
      <td><span class="badge ${s.c}">${s.l}</span></td>
      <td style="font-size:12px;color:var(--text-muted);">${t}</td>
      <td><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openDrawer('${enc}')">详情</button></td>
    </tr>`;
  }).join('')||'<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted);">暂无订单</td></tr>';
}

function selectTab(btn,status){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');curStatus=status;loadOrders(1);}

function openDrawer(enc){
  const o=JSON.parse(decodeURIComponent(enc));
  const s=SM[o.status]||{l:'未知',c:'badge-gray'};
  const pAt=o.paid_at?new Date(o.paid_at).toLocaleString('zh-CN',{hour12:false}):'—';
  const cAt=new Date(o.created_at).toLocaleString('zh-CN',{hour12:false});
  function dr(k,v){return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px;"><span style="color:var(--text-secondary);">${k}</span><span style="font-weight:500;">${v}</span></div>`;}
  document.getElementById('drawerBody').innerHTML=`
    <div style="margin-bottom:16px;"><span class="badge ${s.c}">${s.l}</span></div>
    ${dr('订单号','<span style="font-family:monospace;font-size:12px;">'+esc(o.order_no)+'</span>')}
    ${dr('商品',esc(o.product_name))}
    ${dr('数量',o.quantity+' 份')}
    ${dr('金额','<span style="color:var(--accent);font-weight:700;">¥'+esc(o.total_amount)+'</span>')}
    ${dr('邮箱',esc(o.email||'—'))}
    ${dr('支付方式',esc(o.pay_channel||'—'))}
    ${dr('下单时间',cAt)}
    ${dr('支付时间',pAt)}
    ${o.status===2?`<div style="margin-top:20px;"><a href="order.html?order_no=${encodeURIComponent(o.order_no)}" target="_blank" class="btn btn-secondary btn-sm" style="width:100%;justify-content:center;">查看卡密详情</a></div>`:''}`;
  document.getElementById('drawerOverlay').classList.add('open');
}
function closeDrawer(){document.getElementById('drawerOverlay').classList.remove('open');}
document.getElementById('searchInput').addEventListener('input',()=>loadOrders(1));
loadStats();loadOrders(1);
</script>
</body>
</html>
