<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        var route = id ? "/product/" + encodeURIComponent(id) : "/";
        window.location.replace("/portal/app/#" + route);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to product view...</p>
  </body>
</html>
