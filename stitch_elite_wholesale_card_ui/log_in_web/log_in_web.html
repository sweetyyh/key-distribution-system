<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var next = params.get("next");
        var route = "/login";
        if (next && next.indexOf("/portal/app/#") === 0) {
          next = next.slice("/portal/app/#".length) || "/";
        } else if (next && next.indexOf("/portal/index_web/index_web.html") === 0) {
          next = "/";
        } else if (next && next.indexOf("/portal/single_web/single_web.html") === 0) {
          var productUrl = new URL(next, window.location.origin);
          var productId = productUrl.searchParams.get("id");
          next = productId ? "/product/" + encodeURIComponent(productId) : "/";
        } else if (next && next.indexOf("/portal/order_web/order_web.html") === 0) {
          var orderUrl = new URL(next, window.location.origin);
          var orderNo = orderUrl.searchParams.get("order_no");
          next = orderNo ? "/orders?order_no=" + encodeURIComponent(orderNo) : "/orders";
        }
        if (next) {
          route += "?next=" + encodeURIComponent(next);
        }
        window.location.replace("/portal/app/#" + route);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to login...</p>
  </body>
</html>
