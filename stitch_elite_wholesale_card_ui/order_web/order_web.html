<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var orderNo = params.get("order_no");
        var route = "/orders";
        if (orderNo) {
          route += "?order_no=" + encodeURIComponent(orderNo);
        }
        window.location.replace("/portal/app/#" + route);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to orders...</p>
  </body>
</html>
