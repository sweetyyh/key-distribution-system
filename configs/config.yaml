app:
  name: key-distribution-system
  env: dev

server:
  host: 0.0.0.0
  port: 8080

sqlite:
  path: data/kds.db

jwt:
  buyer_secret: please_change_buyer_secret
  admin_secret: please_change_admin_secret
  expire_hours: 24

payment:
  channels:
    - name: epay
      enabled: true
      pid: your_pid
      key: your_key
      api_url: https://xxx.com/submit.php
      notify_url: https://yourdomain.com/api/v1/pay/callback/epay
      return_url: https://yourdomain.com/orders/{order_no}
